# CI overview
#   - pages           : existing static-site deploy (unchanged)
#   - build:linux     : native x86_64-unknown-linux-gnu (glibc) release binary
#   - build:android   : aarch64-linux-android (Bionic PIE) release binary for Termux
#   - release         : on a version tag, publishes both binaries as a GitLab Release
#
# On a tag, each build job uploads its binary to the project's generic package
# registry (permanent, and anonymously downloadable since the project is public),
# and the release links point there. Job artifacts are members-only and expire,
# so they are kept only as a CI convenience, not as the release download source.
#
# Cut a release by pushing a tag, e.g.:  git tag v0.1.1 && git push origin v0.1.1
# Android build rationale + dead-ends: docs/android-termux-build.md

pages:
  script:
    - echo "Deploying static site"
  artifacts:
    paths:
      - public
  only:
    - main

build:linux:
  stage: build
  image: rust:1.94
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  script:
    - cargo build --release
    - strip target/release/ttree
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading ttree-x86_64-linux-gnu to the package registry for $CI_COMMIT_TAG"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file target/release/ttree \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-x86_64-linux-gnu"
      fi
  artifacts:
    name: "ttree-x86_64-linux-gnu"
    paths:
      - target/release/ttree
    expire_in: 30 days

build:android:
  stage: build
  image: rust:1.94
  variables:
    NDK_VERSION: "r28c"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  # Cache the ~700 MB NDK zip across pipelines, keyed on version, so we only hit
  # dl.google.com on a cache miss (or when NDK_VERSION changes). Caching the zip
  # rather than the unpacked tree keeps the cache small; re-extracting is cheap.
  cache:
    key: "ndk-$NDK_VERSION"
    paths:
      - ndk.zip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip curl file
    - |
      if [ ! -f ndk.zip ]; then
        echo "NDK not in cache, downloading ${NDK_VERSION}..."
        curl -sSLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
      else
        echo "Using cached ndk.zip"
      fi
    - unzip -q ndk.zip
    - export ANDROID_NDK_HOME="$PWD/android-ndk-${NDK_VERSION}"
  script:
    - scripts/build-android.sh
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading ttree-aarch64-linux-android to the package registry for $CI_COMMIT_TAG"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file target/aarch64-linux-android/release/ttree \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-aarch64-linux-android"
      fi
  artifacts:
    name: "ttree-aarch64-linux-android"
    paths:
      - target/aarch64-linux-android/release/ttree
    expire_in: 30 days

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build:linux
      artifacts: false
    - job: build:android
      artifacts: false
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'ttree $CI_COMMIT_TAG'
    description: 'Automated release of ttree $CI_COMMIT_TAG. Prebuilt binaries are attached below.'
    assets:
      links:
        - name: 'ttree-x86_64-linux-gnu (glibc)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-x86_64-linux-gnu'
          filepath: '/ttree-x86_64-linux-gnu'
          link_type: 'package'
        - name: 'ttree-aarch64-linux-android (Termux)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-aarch64-linux-android'
          filepath: '/ttree-aarch64-linux-android'
          link_type: 'package'
