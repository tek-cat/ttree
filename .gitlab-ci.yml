# CI overview (stages run in order; a stage only starts if the previous passed)
#   test    - test:fmt         : cargo fmt --check (formatting gate)
#           - test:clippy      : cargo clippy -D warnings (lint gate)
#           - test:cargo       : cargo test (compiles + runs the unit tests)
#   build   - build:linux      : native x86_64-unknown-linux-gnu (glibc) release binary
#           - build:musl       : x86_64-unknown-linux-musl, statically linked, runs on any distro
#           - build:linux-arm64: aarch64-unknown-linux-gnu, cross-compiled release binary
#           - build:android    : aarch64-linux-android (Bionic PIE) release binary for Termux
#   deploy  - pages            : publish the static landing site (main only)
#           - release          : on a version tag, publish all binaries as a GitLab Release
#
# macOS is not built here: GitLab's shared runners do not offer macOS to free-tier
# projects. Shipping a macOS binary would need either a self-hosted macOS runner or a
# separate GitHub Actions workflow, neither of which is set up yet.
#
# The android build needs no special dependency handling: portable-pty 0.9 uses
# serial2, which compiles for aarch64-linux-android out of the box (see
# docs/android-termux-build.md). It only needs the NDK linker, which
# scripts/build-android.sh wires up.
#
# On a tag, each build job uploads its binary to the project's generic package
# registry (permanent, anonymously downloadable for this public project), and the
# release links point there.
#
# Cut a release by pushing a tag, e.g.:  git tag v0.1.1 && git push origin v0.1.1

stages:
  - test
  - build
  - deploy

# Keep cargo's download caches inside the project dir so GitLab can cache them,
# and share them across every rust job keyed on Cargo.lock (so crates are not
# re-downloaded each run). This caches downloaded sources, not compiled output.
variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.cargo_cache: &cargo_cache
  key:
    files:
      - Cargo.lock
    prefix: cargo
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/

test:fmt:
  stage: test
  image: rust:1.94
  rules:
    # Every branch, not just main: a dev branch nobody lints is a dev
    # branch that fails the moment it is merged.
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - rustup component add rustfmt
    - cargo fmt --check

test:clippy:
  stage: test
  image: rust:1.94
  cache: *cargo_cache
  rules:
    # Every branch, not just main: a dev branch nobody lints is a dev
    # branch that fails the moment it is merged.
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --locked -- -D warnings

test:cargo:
  stage: test
  image: rust:1.94
  cache: *cargo_cache
  rules:
    # Every branch, not just main: a dev branch nobody lints is a dev
    # branch that fails the moment it is merged.
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - cargo test --workspace --locked

build:linux:
  stage: build
  image: rust:1.94
  cache: *cargo_cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  script:
    - cargo build --release --locked
    - strip target/release/ttree
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading ttree-x86_64-linux-gnu to the package registry for $CI_COMMIT_TAG"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file target/release/ttree \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-x86_64-linux-gnu"
      fi
  artifacts:
    name: "ttree-x86_64-linux-gnu"
    paths:
      - target/release/ttree
    expire_in: 30 days

build:musl:
  stage: build
  image: rust:1.94
  cache: *cargo_cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update && apt-get install -y musl-tools
    - rustup target add x86_64-unknown-linux-musl
  script:
    - cargo build --release --locked --target x86_64-unknown-linux-musl
    - strip target/x86_64-unknown-linux-musl/release/ttree
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading ttree-x86_64-linux-musl to the package registry for $CI_COMMIT_TAG"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file target/x86_64-unknown-linux-musl/release/ttree \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-x86_64-linux-musl"
      fi
  artifacts:
    name: "ttree-x86_64-linux-musl"
    paths:
      - target/x86_64-unknown-linux-musl/release/ttree
    expire_in: 30 days

build:linux-arm64:
  stage: build
  image: rust:1.94
  cache: *cargo_cache
  variables:
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update && apt-get install -y gcc-aarch64-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu
  script:
    - cargo build --release --locked --target aarch64-unknown-linux-gnu
    # Stripping is a size optimisation, so never fail a release build over it
    # if the cross binutils are packaged differently than expected.
    - aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/ttree || true
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading ttree-aarch64-linux-gnu to the package registry for $CI_COMMIT_TAG"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file target/aarch64-unknown-linux-gnu/release/ttree \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-aarch64-linux-gnu"
      fi
  artifacts:
    name: "ttree-aarch64-linux-gnu"
    paths:
      - target/aarch64-unknown-linux-gnu/release/ttree
    expire_in: 30 days

# macOS: intentionally no build job here. GitLab shared runners do not provide
# macOS to free-tier projects, and a job that cannot run is worse than none.
# A real macOS binary needs either a self-hosted macOS runner or a separate
# GitHub Actions workflow.

build:android:
  stage: build
  image: rust:1.94
  variables:
    NDK_VERSION: "r28c"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  # Two caches: the ~700 MB NDK zip (keyed on version) and the shared cargo cache.
  cache:
    - key: "ndk-$NDK_VERSION"
      paths:
        - ndk.zip
    - key:
        files:
          - Cargo.lock
        prefix: cargo
      paths:
        - .cargo/registry/index/
        - .cargo/registry/cache/
        - .cargo/git/db/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip curl file
    - |
      if [ ! -f ndk.zip ]; then
        echo "NDK not in cache, downloading ${NDK_VERSION}..."
        curl -sSLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
      else
        echo "Using cached ndk.zip"
      fi
    - unzip -q ndk.zip
    - export ANDROID_NDK_HOME="$PWD/android-ndk-${NDK_VERSION}"
  script:
    - scripts/build-android.sh
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading ttree-aarch64-linux-android to the package registry for $CI_COMMIT_TAG"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file target/aarch64-linux-android/release/ttree \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-aarch64-linux-android"
      fi
  artifacts:
    name: "ttree-aarch64-linux-android"
    paths:
      - target/aarch64-linux-android/release/ttree
    expire_in: 30 days

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Deploying static site"
  artifacts:
    paths:
      - public

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build:linux
      artifacts: false
    - job: build:musl
      artifacts: false
    - job: build:linux-arm64
      artifacts: false
    - job: build:android
      artifacts: false
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'ttree $CI_COMMIT_TAG'
    description: 'Automated release of ttree $CI_COMMIT_TAG. Prebuilt binaries are attached below.'
    assets:
      links:
        - name: 'ttree-x86_64-linux-gnu (glibc)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-x86_64-linux-gnu'
          filepath: '/ttree-x86_64-linux-gnu'
          link_type: 'package'
        - name: 'ttree-x86_64-linux-musl (static)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-x86_64-linux-musl'
          filepath: '/ttree-x86_64-linux-musl'
          link_type: 'package'
        - name: 'ttree-aarch64-linux-gnu (arm64)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-aarch64-linux-gnu'
          filepath: '/ttree-aarch64-linux-gnu'
          link_type: 'package'
        - name: 'ttree-aarch64-linux-android (Termux)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ttree/${CI_COMMIT_TAG}/ttree-aarch64-linux-android'
          filepath: '/ttree-aarch64-linux-android'
          link_type: 'package'
